# Перевірка інсталятора й вікна програми на справжній Windows (гілки, крім main, і вручну).
# Знімки вікна встановлення, екрана з програмою та журнали — в артефакті windows-check.
name: Windows check

on:
  push:
    branches-ignore: [main]
    paths-ignore: ['.claude/**', 'CLAUDE.md', '.mcp.json', '**/*.md']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Збірка SC-DMX-Setup.exe
        shell: pwsh
        run: |
          $nsis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not (Test-Path $nsis)) { choco install nsis -y --no-progress | Out-Null }
          New-Item -ItemType Directory -Force build\app | Out-Null
          git archive --format=zip -o build\src.zip HEAD
          Expand-Archive build\src.zip -DestinationPath build\app
          & $nsis -V2 "-DVERSION=0.0.1" "-DSRC=$pwd\build\app" "-DOUTFILE=$pwd\SC-DMX-Setup.exe" installer\sc-dmx.nsi
          if ($LASTEXITCODE) { exit 1 }

      - name: Встановлення (вікно в режимі автоперевірки)
        shell: pwsh
        run: |
          $env:SCDMX_SETUP_AUTOTEST = '1'
          $env:SCDMX_SETUP_SHOTS = "$pwd\shots"
          # чужий сервер на порту 8080 — встановленню не заважає
          $other = Start-Process python -ArgumentList '-m', 'http.server', '8080' -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 2
          $p = Start-Process .\SC-DMX-Setup.exe -PassThru -Wait
          Stop-Process -Id $other.Id -Force
          "Код виходу інсталятора: $($p.ExitCode)"
          Get-Content "$env:TEMP\SC-DMX-install.log" -Encoding UTF8 | Select-Object -Last 40
          $app = Join-Path $env:LOCALAPPDATA 'SC-DMX'
          foreach ($f in 'Uninstall.exe', 'sc-dmx.pyw', '.venv\Scripts\pythonw.exe') {
            "{0,-28} {1}" -f $f, (Test-Path (Join-Path $app $f))
          }
          if (-not (Test-Path (Join-Path $app 'Uninstall.exe'))) { exit 1 }

      - name: Ярлики й ідентифікатор застосунку
        shell: pwsh
        run: |
          $app = Join-Path $env:LOCALAPPDATA 'SC-DMX'
          Push-Location $app
          .\.venv\Scripts\python.exe -c "from dmxctl import winshell as w; [print(d/'SC DMX.lnk', w._read_id(d/'SC DMX.lnk')) for d in w._shortcut_dirs()]"
          Pop-Location

      - name: Вікно запуску не відкриває програму, поки є оновлення
        shell: pwsh
        run: |
          # підставна «нова версія»: програма має показати вікно оновлення, а не інтерфейс
          New-Item -ItemType Directory -Force fakeapi | Out-Null
          @{ tag_name = 'v99.0.0'; body = "- Перевірка вікна запуску`n- Друга зміна"; html_url = 'https://example.invalid/'
             assets = @(@{ name = 'SC-DMX.zip'; browser_download_url = 'http://127.0.0.1:8790/none.zip' }) } |
            ConvertTo-Json -Depth 5 | Set-Content fakeapi\release.json -Encoding utf8NoBOM
          $api = Start-Process python -ArgumentList '-m', 'http.server', '8790', '--directory', "$pwd\fakeapi" -PassThru -WindowStyle Hidden
          $env:SC_DMX_UPDATE_API = 'http://127.0.0.1:8790/release.json'
          $app = Join-Path $env:LOCALAPPDATA 'SC-DMX'
          Remove-Item (Join-Path $app 'sc-dmx-window.log') -ErrorAction SilentlyContinue
          Start-Process (Join-Path ([Environment]::GetFolderPath('Programs')) 'SC DMX.lnk')
          Start-Sleep -Seconds 20
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          New-Item -ItemType Directory -Force shots | Out-Null
          $bmp.Save("$pwd\shots\3a-splash-update.png")
          $h = @{ 'X-SCDMX-Splash' = '1' }
          $upd = Invoke-RestMethod 'http://127.0.0.1:8080/api/update' -Headers $h
          "Оновлення: available=$($upd.available) latest=$($upd.latest) checked=$($upd.checked)"
          $log = Get-Content (Join-Path $app 'sc-dmx-window.log') -Encoding UTF8 -ErrorAction SilentlyContinue
          $log | Select-String 'Вікно запуску|Відкриття інтерфейсу'
          $opened = [bool]($log | Select-String 'Відкриття інтерфейсу')
          # закриваємо, як кнопка «Закрити» у вікні оновлення
          Invoke-RestMethod 'http://127.0.0.1:8080/api/quit' -Method Post -Headers $h | Out-Null
          Start-Sleep -Seconds 6
          Stop-Process -Id $api.Id -Force
          $left = Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -match 'dmxctl|sc-dmx\.pyw' }
          "Процесів SC DMX після закриття: $(@($left).Count)"
          foreach ($p in $left) { Stop-Process -Id $p.ProcessId -Force -ErrorAction SilentlyContinue }
          if (-not $upd.available -or $opened) { 'Програма відкрилася попри оновлення'; exit 1 }

      - name: Запуск програми, знімок екрана, панель задач
        shell: pwsh
        run: |
          # чужий сервер на порту 8080: SC DMX має запуститися на іншому порту, а не відкрити порожнє вікно
          Start-Process python -ArgumentList '-m', 'http.server', '8080' -WindowStyle Hidden
          Start-Sleep -Seconds 2
          $lnk = Join-Path ([Environment]::GetFolderPath('Programs')) 'SC DMX.lnk'
          Start-Process $lnk
          Start-Sleep -Seconds 25
          $page = try { (Invoke-WebRequest 'http://127.0.0.1:8081/' -UseBasicParsing -TimeoutSec 3).Content } catch { '' }
          "SC DMX на порту 8081: $($page -match '<title>SC DMX</title>')"
          if ($page -notmatch '<title>SC DMX</title>') { exit 1 }
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          New-Item -ItemType Directory -Force shots | Out-Null
          $bmp.Save("$pwd\shots\4-app-screen.png")
          # порожнє вікно — майже один колір на весь екран програми
          $colors = @{}
          for ($x = 40; $x -lt $b.Width - 40; $x += 16) { for ($y = 60; $y -lt $b.Height - 80; $y += 16) { $colors[$bmp.GetPixel($x, $y).ToArgb()] = 1 } }
          "Кольорів на знімку програми: $($colors.Count)"
          $blank = $colors.Count -lt 40
          Start-Sleep -Seconds 20
          $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$pwd\shots\5-app-screen-later.png")
          $app = Join-Path $env:LOCALAPPDATA 'SC-DMX'
          '--- sc-dmx-window.log'
          Get-Content (Join-Path $app 'sc-dmx-window.log') -Encoding UTF8 -ErrorAction SilentlyContinue
          '--- sc-dmx.log'
          Get-Content (Join-Path $app 'sc-dmx.log') -Encoding UTF8 -ErrorAction SilentlyContinue | Select-Object -Last 20
          '--- процеси'
          Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -match 'dmxctl|sc-dmx|QtWebEngine' } |
            ForEach-Object { "$($_.ProcessId) $($_.CommandLine)" }
          if ($blank) { 'Вікно програми порожнє'; exit 1 }
          Push-Location $app
          @'
          import win32gui
          from win32com.propsys import propsys, pscon
          def cb(h, out):
              if win32gui.IsWindowVisible(h) and win32gui.GetWindowText(h) == "SC DMX":
                  out.append(h)
          wins = []
          win32gui.EnumWindows(cb, wins)
          print("Вікна SC DMX:", wins)
          for h in wins:
              s = propsys.SHGetPropertyStoreForWindow(h, propsys.IID_IPropertyStore)
              for k in ("ID", "RelaunchCommand", "RelaunchDisplayNameResource", "RelaunchIconResource"):
                  try:
                      print(k, "=", s.GetValue(getattr(pscon, "PKEY_AppUserModel_" + k)).GetValue())
                  except Exception as e:
                      print(k, "!", e)
          '@ | Set-Content check.py -Encoding UTF8
          .\.venv\Scripts\python.exe check.py
          Pop-Location

      - name: Друга копія не відкривається
        shell: pwsh
        run: |
          $lnk = Join-Path ([Environment]::GetFolderPath('Programs')) 'SC DMX.lnk'
          $app = Join-Path $env:LOCALAPPDATA 'SC-DMX'
          @'
          import ctypes, subprocess, sys, time
          from dmxctl import winshell
          u = ctypes.windll.user32
          def windows():
              out = []
              @ctypes.WINFUNCTYPE(ctypes.c_bool, ctypes.c_void_p, ctypes.c_void_p)
              def cb(h, _):
                  t = ctypes.create_unicode_buffer(64); c = ctypes.create_unicode_buffer(128)
                  u.GetWindowTextW(h, t, 64); u.GetClassNameW(h, c, 128)
                  if t.value == "SC DMX" and "Qt" in c.value and u.IsWindowVisible(h):
                      out.append(h)
                  return True
              u.EnumWindows(cb, 0)
              return out
          def servers():
              r = subprocess.run(["powershell", "-NoProfile", "-Command",
                  "(Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -match 'dmxctl.server' }).Count"],
                  capture_output=True, text=True)
              return r.stdout.strip()
          print("до:", len(windows()), "вікно(а), серверів:", servers())
          for _ in range(2):
              subprocess.run(["cmd", "/c", "start", "", sys.argv[1]])
              time.sleep(8)
          w = windows()
          print("після 2 повторних запусків:", len(w), "вікно(а), серверів:", servers())
          ok = len(w) == 1
          u.ShowWindow(ctypes.c_void_p(w[0]), 6)        # згорнути
          time.sleep(1)
          print("згорнуто:", bool(u.IsIconic(ctypes.c_void_p(w[0]))))
          subprocess.run(["cmd", "/c", "start", "", sys.argv[1]])
          time.sleep(8)
          restored = not u.IsIconic(ctypes.c_void_p(w[0]))
          print("після запуску розгорнуто:", restored, "| вікон:", len(windows()))
          sys.exit(0 if ok and restored and len(windows()) == 1 else 1)
          '@ | Set-Content "$app\single.py" -Encoding UTF8
          Push-Location $app
          .\.venv\Scripts\python.exe single.py $lnk
          $code = $LASTEXITCODE
          Pop-Location
          exit $code
          Get-Content (Join-Path $app 'sc-dmx.log') -ErrorAction SilentlyContinue | Select-Object -Last 20

      - name: Повторне встановлення, коли SC DMX відкрито (лише ярлик у меню «Пуск»)
        shell: pwsh
        run: |
          $env:SCDMX_SETUP_AUTOTEST = '1'
          $env:SCDMX_SETUP_SHOTS = "$pwd\shots\again"
          $env:SCDMX_SETUP_LINKS = 'start'
          $desk = Join-Path ([Environment]::GetFolderPath('Desktop')) 'SC DMX.lnk'
          $start = Join-Path ([Environment]::GetFolderPath('Programs')) 'SC DMX.lnk'
          Remove-Item $desk -ErrorAction SilentlyContinue
          $p = Start-Process .\SC-DMX-Setup.exe -PassThru -Wait
          "Код виходу інсталятора: $($p.ExitCode)"
          Get-Content "$env:TEMP\SC-DMX-install.log" -Encoding UTF8 | Select-String 'закриття|Зупиняю|закрито|Завершено|Запуск'
          $left = Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -match 'dmxctl|sc-dmx\.pyw' }
          "Процесів SC DMX після встановлення: $(@($left).Count)"
          "Ярлик на робочому столі: $(Test-Path $desk) (має бути False), у меню «Пуск»: $(Test-Path $start)"
          Copy-Item "$env:TEMP\SC-DMX-install.log" shots\install-again.log -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0 -or (Test-Path $desk) -or -not (Test-Path $start)) { exit 1 }

      - name: Видалення лише сцен і кольорів (решта даних лишається)
        shell: pwsh
        run: |
          $env:SCDMX_SETUP_AUTOTEST = '1'
          $env:SCDMX_SETUP_SHOTS = "$pwd\shots\uninstall"
          $env:SCDMX_UNINSTALL_PARTS = 'scenes,colors'
          $app = Join-Path $env:LOCALAPPDATA 'SC-DMX'
          $cfg = Join-Path $app 'config.json'
          @{
            output = @{ type = 'udmx' }; master = 200
            fixtures = @(@{ id = 'f1'; name = 'Left'; address = 1; profile = 'RGB' })
            scenes = @{ Evening = @{ fixtures = @{ f1 = @{ r = 255 } }; effect = $null } }
            static_colors = @(@{ name = 'Red'; r = 255; g = 0; b = 0 })
          } | ConvertTo-Json -Depth 10 | Set-Content $cfg -Encoding utf8NoBOM
          $p = Start-Process (Join-Path $app 'Uninstall.exe') -PassThru
          Start-Sleep -Seconds 5
          $end = (Get-Date).AddMinutes(3)
          while ((Get-Date) -lt $end) {
            $busy = Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -match 'uninstall-gui\.ps1|Un_A\.exe|Au_\.exe' }
            if (-not $busy) { break }
            Start-Sleep -Seconds 2
          }
          Get-Content "$env:TEMP\SC-DMX-uninstall.log" -Encoding UTF8
          Copy-Item "$env:TEMP\SC-DMX-uninstall.log" shots\ -ErrorAction SilentlyContinue
          '--- залишилося в теці програми'
          Get-ChildItem $app -Force -ErrorAction SilentlyContinue | ForEach-Object { $_.Name }
          $ok = $true
          if (-not (Test-Path $cfg)) { 'config.json видалено, а мав лишитися'; $ok = $false }
          else {
            $c = Get-Content $cfg -Raw -Encoding UTF8 | ConvertFrom-Json
            "сцени: $($null -ne $c.scenes)  кольори: $($null -ne $c.static_colors)  прилади: $(@($c.fixtures).Count)  вихід: $($c.output.type)"
            if ($null -ne $c.scenes -or $null -ne $c.static_colors -or @($c.fixtures).Count -ne 1 -or $c.output.type -ne 'udmx') { $ok = $false }
          }
          foreach ($f in 'Uninstall.exe', '.venv', 'dmxctl', 'sc-dmx.pyw') {
            if (Test-Path (Join-Path $app $f)) { "Не видалено: $f"; $ok = $false }
          }
          foreach ($d in [Environment]::GetFolderPath('Desktop'), [Environment]::GetFolderPath('Programs')) {
            if (Test-Path (Join-Path $d 'SC DMX.lnk')) { "Ярлик не видалено: $d"; $ok = $false }
          }
          $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\SC-DMX'
          if (Test-Path $key) { 'Запис у «Програми та компоненти» не видалено'; $ok = $false }
          if (-not $ok) { exit 1 }
          'Видалення: усе як треба'

      - name: Артефакти
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force shots | Out-Null
          Copy-Item "$env:TEMP\SC-DMX-install.log" shots\ -ErrorAction SilentlyContinue
      - name: Знімки в журнал (base64, для перегляду без артефактів)
        if: always()
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          foreach ($f in Get-ChildItem shots -Filter *.png -Recurse) {
            $img = [System.Drawing.Image]::FromFile($f.FullName)
            $k = [Math]::Min(1.0, 1400 / $img.Width)
            $bmp = New-Object System.Drawing.Bitmap ([int]($img.Width * $k)), ([int]($img.Height * $k))
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.InterpolationMode = 'HighQualityBicubic'
            $g.DrawImage($img, 0, 0, $bmp.Width, $bmp.Height)
            $ms = New-Object IO.MemoryStream
            $bmp.Save($ms, [System.Drawing.Imaging.ImageFormat]::Jpeg)
            $b64 = [Convert]::ToBase64String($ms.ToArray())
            for ($i = 0; $i -lt $b64.Length; $i += 3000) {
              "SHOT|$($f.Directory.Name)-$($f.BaseName)|" + $b64.Substring($i, [Math]::Min(3000, $b64.Length - $i))
            }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-check
          path: shots
